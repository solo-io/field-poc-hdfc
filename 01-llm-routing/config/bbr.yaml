---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway
  namespace: agentgateway-system
  labels:
    app: agentgateway
spec:
  gatewayClassName: enterprise-agentgateway
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

# --- Feature: providers ---

---
apiVersion: v1
kind: Secret
metadata:
  name: vertex-ai-secret
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: providers
stringData:
  Authorization: <set GOOGLE_APPLICATION_CREDENTIALS>

---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: vertex-ai
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/provider: vertex-ai
spec:
  ai:
    provider:
      vertexai:
        projectId: customer-success-386314
        region: us-central1
  policies:
    auth:
      secretRef:
        name: vertex-ai-secret

---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: local-ollama
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/provider: local-ollama
spec:
  ai:
    provider:
      openai:
        model: llama3
      host: host.minikube.internal
      port: 11434
      path: /v1/chat/completions

---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: body-routing-policy
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: providers
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: X-Gateway-Model-Name
            value: json(request.body).model
          - name: X-Gateway-Model-Status
            value: 'default(json(request.body).model, "") != "" ? "specified" : "unspecified"'

---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: providers-fallback
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/provider: provider-name
    agentgateway.dev/feature: providers
    agentgateway.dev/mode: body-routing-fallback
spec:
  ai:
    groups:
      - providers:
          - name: vertex-ai
            vertexai:
              model: google/gemini-2.5-flash
              projectId: customer-success-386314
              region: us-central1
            policies:
              auth:
                secretRef:
                  name: vertex-ai-secret
      - providers:
          - name: local-ollama
            openai:
              model: llama3
            host: host.minikube.internal
            port: 11434
            path: /v1/chat/completions

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: providers-single-route
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/provider: provider-name
    agentgateway.dev/feature: providers
    agentgateway.dev/mode: body-routing
spec:
  parentRefs:
    - name: agentgateway
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            value: /chat
          headers:
            - name: X-Gateway-Model-Name
              value: google/gemini-.*
              type: RegularExpression
      backendRefs:
        - name: vertex-ai
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
    - matches:
        - path:
            value: /chat
          headers:
            - name: X-Gateway-Model-Name
              value: llama3
      backendRefs:
        - name: local-ollama
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
    - matches:
        - path:
            value: /chat
          headers:
            - name: X-Gateway-Model-Status
              value: unspecified
      backendRefs:
        - name: providers-fallback
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
