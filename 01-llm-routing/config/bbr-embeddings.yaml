# --- Default Gateway (referenced by HTTPRoutes below) ---
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway
  namespace: agentgateway-system
  labels:
    app: agentgateway
spec:
  gatewayClassName: enterprise-agentgateway
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

# --- Feature: providers ---

---
apiVersion: v1
kind: Secret
metadata:
  name: openai-secret
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: providers
stringData:
  Authorization: <set OPENAI_API_KEY>

---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openai
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/provider: openai
spec:
  ai:
    provider:
      openai:
        model: text-embedding-3-small
  policies:
    auth:
      secretRef:
        name: openai-secret
    ai:
      routes:
        /v1/embeddings: Passthrough
        "*": Passthrough

---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: local-ollama
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/provider: local-ollama
spec:
  ai:
    provider:
      openai:
        model: bge-m3
      host: host.minikube.internal
      port: 11434
      path: /api/embed
  policies:
    ai:
      routes:
        /api/embed: Passthrough
        "*": Passthrough

---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: body-routing-policy
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: providers
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: X-Gateway-Model-Name
            value: json(request.body).model
          - name: X-Gateway-Model-Status
            value: 'default(json(request.body).model, "") != "" ? "specified" : "unspecified"'

---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: providers-fallback
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/provider: provider-name
    agentgateway.dev/feature: providers
    agentgateway.dev/mode: body-routing-fallback
spec:
  ai:
    groups:
      - providers:
          - name: openai
            openai:
              model: text-embedding-3-large
            policies:
              auth:
                secretRef:
                  name: openai-secret
              ai:
                routes:
                  /v1/embeddings: Passthrough
                  "*": Passthrough
      - providers:
          - name: local-ollama
            openai:
              model: all-minilm
            host: host.minikube.internal
            port: 11434
            path: /api/embed
            policies:
              ai:
                routes:
                  /api/embed: Passthrough
                  "*": Passthrough

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: providers-single-route
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/provider: provider-name
    agentgateway.dev/feature: providers
    agentgateway.dev/mode: body-routing
spec:
  parentRefs:
    - name: agentgateway
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            value: /embeddings
          headers:
            - name: X-Gateway-Model-Name
              value: text-embedding-3-small
      backendRefs:
        - name: openai
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
    - matches:
        - path:
            value: /embeddings
          headers:
            - name: X-Gateway-Model-Name
              value: bge-m3
      backendRefs:
        - name: local-ollama
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
    - matches:
        - path:
            value: /embeddings
          headers:
            - name: X-Gateway-Model-Status
              value: unspecified
      backendRefs:
        - name: providers-fallback
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
