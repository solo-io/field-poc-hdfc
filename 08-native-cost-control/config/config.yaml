          name: model-costs-catalog
          key: catalog.json

---
# --- Gateway patch (model-costs) ---
# Attaches the model cost catalog to the Gateway via spec.infrastructure.parametersRef.
# Can't safely preview a live patch without hitting the cluster during dry-run:
# kubectl patch gateway agentgateway-gw -n agentgateway-system --type=merge -p '{"spec":{"infrastructure":{"parametersRef":{"name":"model-costs-params","group":"enterpriseagentgateway.solo.io","kind":"EnterpriseAgentgatewayParameters"}}}}'

# --- Feature: keycloak-jwt-auth ---

---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBackend
metadata:
  name: keycloak-jwks
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: keycloak-jwt-auth
spec:
  policies:
    tls:
      sni: keycloak.demo.kasunt.apac.fe.solo.io
  static:
    host: keycloak.demo.kasunt.apac.fe.solo.io
    port: 443

# --- Feature: virtual-keys ---

---
apiVersion: v1
kind: Secret
metadata:
  name: virtual-keys
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: virtual-keys
type: Opaque
stringData:
  team-ci: '{"key":"sk-team-ci-demo-9f3c7a1e","metadata":{"id":"team-ci","user_id":"team-ci"}}'

---
apiVersion: ratelimit.solo.io/v1alpha1
kind: RateLimitConfig
metadata:
  name: virtual-keys-ratelimit
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: virtual-keys
spec:
  raw:
    descriptors:
      - key: user_id
        value: team-ci
        rateLimit:
          unit: HOUR
          requestsPerUnit: 5000
    rateLimits:
      - actions:
          - cel:
              expression: apiKey.user_id
              key: user_id
        type: TOKEN

# --- Feature: openfga-authz ---
# ext_authz backed by https://github.com/day0ops/openfga-ext-authz

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga-ext-authz
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: openfga-authz
    app: openfga-ext-authz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfga-ext-authz
  template:
    metadata:
      labels:
        app: openfga-ext-authz
    spec:
      containers:
        - name: openfga-ext-authz
          image: australia-southeast1-docker.pkg.dev/field-engineering-apac/kasunt/openfga-ext-authz:v0.1.0
          ports:
            - containerPort: 9001
              name: grpc
          env:
            - name: PORT
              value: '9001'
            - name: OPENFGA_API_URL
              value: http://openfga.openfga.svc.cluster.local:8080
            - name: OPENFGA_STORE_ID
              value: <STORE_ID>
            - name: OPENFGA_MODEL_ID
              value: <MODEL_ID>
            - name: OPENFGA_RELATION
              value: can_use
            - name: USER_HEADER
              value: x-user-id
            - name: OBJECT_TYPE
              value: model

---
apiVersion: v1
kind: Service
metadata:
  name: openfga-ext-authz
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: openfga-authz
spec:
  selector:
    app: openfga-ext-authz
  ports:
    - port: 9001
      targetPort: 9001
      name: grpc

# --- Feature: budget-limits ---

---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayBudget
metadata:
  name: human-budgets
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: budget-limits
spec:
  budgets:
    - name: acme-org-monthly-ceiling
      subject:
        org_id: acme
      limit:
        unit: USD
        amount: 200
      window:
        unit: Month
      onBudgetExceeded: Audit
    - name: acme-ml-team-monthly-cap
      subject:
        team_id: acme-ml
      limit:
        unit: USD
        amount: 50
      window:
        unit: Month
      onBudgetExceeded: Block
    - name: alice-daily-cap
      subject:
        username: alice
      limit:
        unit: USD
        amount: 5
      window:
        unit: Day
      onBudgetExceeded: Block
    - name: bob-daily-cap
      subject:
        username: bob
      limit:
        unit: USD
        amount: 10
      window:
        unit: Day
      onBudgetExceeded: Block
    - name: team-ci-daily-cap
      subject:
        virtualKey: team-ci
      limit:
        unit: Tokens
        amount: 1
      window:
        unit: Day
      onBudgetExceeded: Block

# --- Feature: rate-limit ---

---
apiVersion: ratelimit.solo.io/v1alpha1
kind: RateLimitConfig
metadata:
  name: chat-burst-limit
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: rate-limit
spec:
  raw:
    descriptors:
      - key: generic_key
        value: counter
        rateLimit:
          requestsPerUnit: 20000
          unit: MINUTE
    rateLimits:
      - actions:
          - genericKey:
              descriptorValue: counter
        type: TOKEN

# --- Merged EnterpriseAgentgatewayPolicy Resources ---
# The following policies were merged from multiple features:

---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: merged-providers-keycloak-jwt-auth-virtual-keys-agentgateway-gw
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: virtual-keys
    agentgateway.dev/merged-policy: 'true'
    agentgateway.dev/contributors: providers_keycloak-jwt-auth_virtual-keys
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: agentgateway-gw
  traffic:
    phase: PreRouting
    transformation:
      request:
        set:
          - name: X-Gateway-Model-Name
            value: json(request.body).model
          - name: x-user-id
            value: coalesce(jwt['preferred_username'], apiKey['user_id'])
    jwtAuthentication:
      mode: Optional
      providers:
        - issuer: https://keycloak.demo.kasunt.apac.fe.solo.io/realms/agw-dev
          audiences:
            - account
          jwks:
            remote:
              jwksPath: realms/agw-dev/protocol/openid-connect/certs
              cacheDuration: 5m
              backendRef:
                group: enterpriseagentgateway.solo.io
                kind: EnterpriseAgentgatewayBackend
                name: keycloak-jwks
                namespace: agentgateway-system
    apiKeyAuthentication:
      mode: Optional
      secretRef:
        name: virtual-keys
      location:
        header:
          name: X-Api-Key
    entRateLimit:
      global:
        rateLimitConfigRefs:
          - name: virtual-keys-ratelimit

---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: merged-openfga-authz-budget-limits-rate-limit-providers-chat-route
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: rate-limit
    agentgateway.dev/merged-policy: 'true'
    agentgateway.dev/contributors: openfga-authz_budget-limits_rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: providers-chat-route
  traffic:
    extAuth:
      backendRef:
        name: openfga-ext-authz
        namespace: agentgateway-system
        port: 9001
      grpc: {}
      forwardBody:
        maxSize: 8192
    entBudgetEnforcement: {}
    entRateLimit:
      global:
        rateLimitConfigRefs:
          - name: chat-burst-limit
