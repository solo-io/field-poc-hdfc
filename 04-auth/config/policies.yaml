# EnterpriseAgentgatewayPolicy Resources
# JWT Authentication and MCP Tool Access policies

# JWT Authentication for stock-agent route
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: jwt-auth-stock-agent
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: obo-token-exchange
    agentgateway.dev/merged-policy: "true"
    agentgateway.dev/contributors: obo-token-exchange
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: stock-agent
  traffic:
    jwtAuthentication:
      mode: Strict
      providers:
        - issuer: http://keycloak.keycloak.svc.cluster.local:8080/realms/agw-dev
          audiences:
            - agentgateway
          jwks:
            remote:
              jwksPath: realms/agw-dev/protocol/openid-connect/certs
              cacheDuration: 5m
              backendRef:
                group: ""
                kind: Service
                name: keycloak
                namespace: keycloak
                port: 8080

