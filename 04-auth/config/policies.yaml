# MCP Tool Access Authorization
---
apiVersion: enterpriseagentgateway.solo.io/v1alpha1
kind: EnterpriseAgentgatewayPolicy
metadata:
  name: mcp-tool-access
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: mcp-tool-access
    agentgateway.dev/merged-policy: "true"
    agentgateway.dev/contributors: mcp-tool-access
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: mcp-backend
  backend:
    mcp:
      authorization:
        action: Allow
        policy:
          matchExpressions:
            - jwt.azp == "chain-stock-agent" && mcp.tool.name == "get_stock_price"
