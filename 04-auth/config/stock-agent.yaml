# Feature: workload-agent - Stock Agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stock-agent
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: workload-agent
    app: stock-agent

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-agent
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: workload-agent
    app: stock-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stock-agent
  template:
    metadata:
      labels:
        app: stock-agent
    spec:
      serviceAccountName: stock-agent
      containers:
        - name: agent
          image: stock-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak.keycloak.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: agw-dev
            - name: CLIENT_ID
              value: chain-stock-agent
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chain-stock-agent-credentials
                  key: client_secret
                  optional: true
            - name: AUDIENCE
              value: agentgateway
            - name: STOCK_AGENT_URL
              value: http://agentgateway.agentgateway-system.svc.cluster.local:8080/agent/run
            - name: USE_TOKEN_EXCHANGE
              value: "true"
            - name: LLM_BASE_URL
              value: http://agentgateway.agentgateway-system.svc.cluster.local:8080/openai
            - name: MCP_URL
              value: http://agentgateway.agentgateway-system.svc.cluster.local:8080/mcp
            - name: MODEL
              value: gpt-4o-mini
            - name: MCP_AUTH_MODE
              value: workload
            - name: SA_TOKEN_PATH
              value: /var/run/secrets/tokens/sa-token
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          volumeMounts:
            - name: sa-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
      volumes:
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: sa-token
                  expirationSeconds: 3600
                  audience: agentgateway

---
apiVersion: v1
kind: Service
metadata:
  name: stock-agent
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: workload-agent
    app: stock-agent
spec:
  selector:
    app: stock-agent
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stock-agent
  namespace: agentgateway-system
  labels:
    app.kubernetes.io/managed-by: agentgateway-demo
    agentgateway.dev/feature: workload-agent
    app: stock-agent
spec:
  parentRefs:
    - name: agentgateway
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /agent
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: stock-agent
          namespace: agentgateway-system
          port: 8080
